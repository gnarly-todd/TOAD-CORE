name: Build and publish TITAN CORE v1.3-experimental
on:
  push:
    branches: [experimental/performance]
    paths:
      - .github/workflows/publish-v1.3-experimental.yml
permissions:
  contents: write
concurrency:
  group: titan-core-v1.3-experimental-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/experimental/performance'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable v1.3 and pinned components
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = 2aa3e81d329e21f63b064de81bd5bb1717b3e412
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.3 > stable-before.json
          jq -e '.id == 457001102 and .prerelease == false and (.assets | map(.id) | sort) == [787853219,787853221]' stable-before.json
          jq -e '.assets[] | select(.name == "TITAN-CORE.elf") | .digest == "sha256:2baa241d9598064aaa0f227c14f4f7a431a2abad45e616def4986713028241f4"' stable-before.json
          grep -q '^version = "1.3.0-experimental"$' Cargo.toml
          python3 review/verify-kstuff-fast-pin.py
          python3 review/verify-unified-payloads.py
          python3 review/sync-component-readme.py --check
          (cd vendor/ampr-emu-ng && sha256sum -c --strict SHA256SUMS)
          (cd vendor/dlc_emu && sha256sum -c --strict SHA256SUMS)
          (cd vendor/pgo_stub && sha256sum -c --strict SHA256SUMS)
          echo '7ca61afc444f0b44d2f005506dde16cb43e74dae4b1e045323b291b8db1c3d5d  vendor/ampr-emu-ng/libSceAmpr.sprx' | sha256sum -c --strict
          test ! -e review/ampr-experimental/apply.py
          test ! -e .github/workflows/experimental-ampr.yml
      - name: FreeBSD compile check and UI syntax
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-freebsd
          RUSTFLAGS=-Dwarnings cargo check --workspace --features unified-stack --locked --target x86_64-unknown-freebsd
          sed -n '/^<script>$/,/^<\/script>$/p' src/ui.html | sed '1d;$d' > "$RUNNER_TEMP/ui.js"
          test -s "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"
      - name: Build two-stage experimental PS5 ELF
        run: TITAN_UNIFIED_STACK=1 bash ps5/build.sh
      - name: Verify ELF identity and checksum
        run: |
          cp target/ps5/titan-core.elf TITAN-CORE-experimental.elf
          sha256sum TITAN-CORE-experimental.elf > SHA256SUMS
          sha256sum -c --strict SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          b=Path("TITAN-CORE-experimental.elf").read_bytes()
          assert b[:4]==b"\x7fELF"
          for text in (b"1.3.0-experimental", b"titan-core.elf", b"ampr-emu-ng 0.5.1", b"1.13-fpkg-dr-test8-rest-fast", b"1.7beta12"):
              assert text in b, f"Missing identity: {text!r}"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TITAN-CORE-v1.3-experimental
          path: |
            TITAN-CORE-experimental.elf
            SHA256SUMS
          if-no-files-found: error
      - name: Publish prerelease, preserve stable
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = 2aa3e81d329e21f63b064de81bd5bb1717b3e412
          if gh release view v1.3-experimental --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 1; fi
          gh release create v1.3-experimental --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TITAN CORE v1.3-experimental (Kraken Mount 0.3.2 + Performance)" --notes-file RELEASE-v1.3-experimental.md --prerelease --latest=false TITAN-CORE-experimental.elf SHA256SUMS
          gh release view v1.3-experimental --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,assets
          gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.3 > stable-after.json
          diff -u <(jq -S '{id,tag_name,name,body,prerelease,assets:[.assets[]|{id,name,digest}]}' stable-before.json) <(jq -S '{id,tag_name,name,body,prerelease,assets:[.assets[]|{id,name,digest}]}' stable-after.json)
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = 2aa3e81d329e21f63b064de81bd5bb1717b3e412
